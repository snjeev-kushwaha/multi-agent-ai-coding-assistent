server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- client-side router (if added later) needs this
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + SSE stream to the backend. Set BACKEND_HOST via an env-substituted
    # config in real deployments; hardcode the service name for docker-compose.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Required for SSE: disable buffering and raise the read timeout so
        # long-running generation jobs don't get their stream cut mid-way.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
