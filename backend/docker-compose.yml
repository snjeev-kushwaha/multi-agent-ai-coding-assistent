version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEBUG=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-only-secret-change-me}
      - DATABASE_URL=postgresql+asyncpg://coder_buddy:coder_buddy@postgres:5432/coder_buddy
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CORS_ORIGINS=["http://localhost:5173"]
    volumes:
      - generated_projects:/app/generated_projects
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=coder_buddy
      - POSTGRES_PASSWORD=coder_buddy
      - POSTGRES_DB=coder_buddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder_buddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Provisioned for the production swap described in app/workers/job_worker.py
  # and app/workers/event_bus.py (Celery/RQ broker + cross-replica pub/sub).
  # Not wired into the app yet -- the in-process worker/event bus works
  # standalone for single-instance deployments.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  generated_projects:
